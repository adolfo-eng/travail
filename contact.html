<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/contact.css">
</head>
<body> 
    <hr>
    <main>
        <section>
         <h2 class="form">Formulaire de contact complet</h2>
          <form action="">
            <p>
            <label for="nom" class="form">Nom complet</label> <br>
            <input type="text" id="nom" name="nom" placeholder="votre nom" required>
            </p>

            <p>
               <label for="email" class="form">Email</label> <br>
               <input type="text" name="email" id="email" placeholder="exemple@gmail.com" required class="black">
             </p>

             <p>
                <label for="sujet" class="form">Sujet :</label> <br>
                <input type="text" name="sujet" id="sujet" placeholder="Objet de votre message" required class="black">
             </p>

             <p>
                <label for="message" class="form">Message</label><br>
                <textarea name="message" id="message" rows="5" cols="50" required placeholder="Ecrivez votre motivation ici" class="black"></textarea>
             </p>

             <fieldset>
                <input type="radio" id="abonnement" name="options" class="form">
                <label for="abonnement" class="form">S'abonner mensuellement</label>
                <br>
                <input type="radio" id="visite" name="options" class="form">
                <label for="visite" class="form">Visiter uniquement</label>
             </fieldset>
             <br> <button type="submit" class="form">Envoyer les informations</button>        
              </form>
       </section>
       <hr>
       <section>
            <h2>Mes Coordonnées</h2>

        </section>
    </main>

    </footer>
</body>

</html>
